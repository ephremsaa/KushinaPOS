[package]
name = "kushina-pos"
version = "1.0.0"
description = "KushinaPOS Desktop Restaurant Management & POS"
authors = ["KushinaPOS Team"]
edition = "2021"

[lib]
name = "kushina_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
